[project]
name = "epi-integration"
version = "1.0.0"
description = "Fase 3.5 - Integração end-to-end do pipeline de segurança (EPI Vision)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
