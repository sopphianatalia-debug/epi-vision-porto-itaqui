[project]
name = "epi-identity-module"
version = "1.0.0"
description = "Módulo 1 — Identificação biométrica de funcionários por visão computacional"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "aiosqlite>=0.19",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "pyjwt>=2.8",
    "cryptography>=42.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29", "alembic>=1.13"]
recognition = ["insightface>=0.7", "onnxruntime>=1.17", "opencv-python-headless>=4.9"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "aiosqlite>=0.19"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
