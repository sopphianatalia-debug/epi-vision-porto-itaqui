[project]
name = "epi-ppe-detection-module"
version = "1.0.0"
description = "Módulo 2 — Detecção de pessoas e EPIs por visão computacional"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
detection = ["ultralytics>=8.1", "opencv-python-headless>=4.9"]
# Para o visualizador com janela use opencv-python (não headless):
viewer = ["opencv-python>=4.9", "numpy>=1.26"]
dev = ["pytest>=8.0", "httpx>=0.27", "opencv-python-headless>=4.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
