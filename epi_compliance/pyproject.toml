[project]
name = "epi-compliance-module"
version = "1.0.0"
description = "Módulo 3 — Verificação inteligente do uso correto de EPIs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
]

[project.optional-dependencies]
pose = ["ultralytics>=8.1"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
